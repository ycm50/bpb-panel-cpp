name: build

# 本工作流只产出**可执行二进制**，不构建、不推送任何容器镜像。
# alpine 容器仅作为一次性的编译环境（提供 musl 与静态库），跑完即弃。
#
# 触发方式：只有手动（workflow_dispatch）。
#
# 产物是**按协议分开的二进制**：每个入栈协议各自编一个（-DBPB_INBOUNDS=<协议>），
# 不是把多个协议塞进同一个二进制。选 all 就是“全协议”——把每个协议的二进制
# 全部构建并发布。协议清单从 CMakeLists.txt 的 BPB_ALL_INBOUNDS 里读，
# 所以新增协议只改那一处，CI 自动跟上。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（必须等全部构建成功后才会创建或覆盖），例如 v1.0.2"
        required: true
        type: string
      protocols:
        description: "编译哪些入栈协议（all = 每个协议各出一个二进制）"
        required: true
        default: all
        type: choice
        # 与 CMakeLists.txt 的 BPB_ALL_INBOUNDS 保持一致；plan 会再校验一次，
        # 选了清单外的协议直接报错。
        #
        # 注意 vless-xhttp / vless-grpc 是“传输绑定”，不是独立的 websocket 协议：
        # 选 vless 会连带编入 vless-xhttp（所以那个二进制的启动行是
        # "inbounds: vless,vless-xhttp"），所以不要假设“选什么就只编什么”。
        options:
          - all
          - vless
          - trojan
          - shadowsocks
          - vmess
          - vless-xhttp
          - vless-grpc

# 手动发布不允许被"再点一次 Run"掐断：同一个 ref 的第二次手动触发会让旧的
# 运行直接失败（哪怕它已经编完一半），所以这里必须是 false。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 决定这次要编哪些协议。唯一的真相来源是 CMakeLists.txt：
  #   set(BPB_ALL_INBOUNDS vless trojan)
  # 新增协议时只改那一行，这里不用跟着改。
  # ---------------------------------------------------------------------------
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      protocols: ${{ steps.list.outputs.protocols }}
      linux_matrix: ${{ steps.list.outputs.linux_matrix }}
      combined: ${{ steps.list.outputs.combined }}
      linux_matrix_all: ${{ steps.list.outputs.linux_matrix_all }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          set -euo pipefail
          # tr -d '\r' first: a Windows checkout (core.autocrlf) would otherwise
          # leave a CR at the end of the line and the anchored pattern never matches.
          all="$(tr -d '\r' < CMakeLists.txt | sed -n 's/^set(BPB_ALL_INBOUNDS \(.*\))$/\1/p' | tail -1)"
          [ -n "$all" ] || { echo '::error::BPB_ALL_INBOUNDS not found in CMakeLists.txt'; exit 1; }
          case "${{ inputs.protocols }}" in
            all) list="$all" ;;
            *)
              list="${{ inputs.protocols }}"
              case " $all " in
                *" $list "*) ;;
                *) echo "::error::$list is not in BPB_ALL_INBOUNDS ($all)"; exit 1 ;;
              esac
              ;;
          esac
          json="$(printf '%s\n' $list | sed 's/.*/"&"/' | paste -sd, -)"
          echo "protocols=[$json]" >> "$GITHUB_OUTPUT"
          # A combined binary with every inbound is published next to the
          # per-protocol ones. install.sh downloads it by default: a trimmed
          # binary silently lacks gRPC/XHTTP, so the panel switches store
          # true while the subscription can never contain such a line.
          if [ "${{ inputs.protocols }}" = "all" ]; then
            echo "combined=all" >> "$GITHUB_OUTPUT"
            combos_all=""
            for pair in amd64:linux/amd64 arm64:linux/arm64 armv7:linux/arm/v7 386:linux/386 riscv64:linux/riscv64; do
              arch=${pair%%:*}
              plat=${pair#*:}
              [ -n "$combos_all" ] && combos_all="$combos_all,"
              combos_all="$combos_all{\"protocol\":\"all\",\"arch\":\"$arch\",\"platform\":\"$plat\"}"
            done
            echo "linux_matrix_all=[$combos_all]" >> "$GITHUB_OUTPUT"
          else
            echo "combined=" >> "$GITHUB_OUTPUT"
            echo "linux_matrix_all=[]" >> "$GITHUB_OUTPUT"
          fi

          # 架构 -> docker platform 的映射只写一次，直接生成完整的 协议x架构
          # 组合。故意不用 matrix.include 去“补” platform：include 的合并规则
          # 依赖是否与已有取值冲突，很容易写出多出或缺失的组合。
          combos=""
          for proto in $list; do
            for pair in amd64:linux/amd64 arm64:linux/arm64 armv7:linux/arm/v7 386:linux/386 riscv64:linux/riscv64; do
              arch=${pair%%:*}
              plat=${pair#*:}
              [ -n "$combos" ] && combos="$combos,"
              combos="$combos{\"protocol\":\"$proto\",\"arch\":\"$arch\",\"platform\":\"$plat\"}"
            done
          done
          echo "linux_matrix=[$combos]" >> "$GITHUB_OUTPUT"
          echo "building: $list"

  # --- 并行度：不要给 cmake --build 传 -j -------------------------------------
  # Ninja 自带默认值 = 可用核心数 + 2（20 核机器上是 22），已经吃满。手工传
  # -j 不会更快，反而要解决"怎么在容器/MSYS2 里取核心数"这个问题——第一版就是这么
  # 踩的：Windows 那 6 个 job 全部失败在 Configure and build，而 Linux 35 个全过。
  # 别加。
  # ---------------------------------------------------------------------------
  # 各架构 × 各协议的静态 Linux 二进制。
  #
  # 编译环境是 Alpine（musl），不是 glibc：源代码里不能出现 musl 没有的
  # 头/函数（例如 <execinfo.h> 与 backtrace()）。这类依赖必须用
  # __has_include 之类的探测包起来，否则整个矩阵一起编译失败。
  #
  # 用 CMake 而不是裸 g++：CMake 负责配置 lwIP 的 include 路径与 C 源文件，
  # 裸命令会漏掉 src/include 与 third_party/lwip（之前 CI 就是因此报
  # "lwip/opt.h: No such file or directory"）。
  # 用 -DBPB_STATIC=ON 而不是只加 -static：否则 CMake 仍解析到 libssl.so，
  # 链接会报 "attempted static link of dynamic object"。
  # ---------------------------------------------------------------------------
  linux:
    name: linux-${{ matrix.arch }}-${{ matrix.protocol }}
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # 完整的 协议 x 架构 组合，由 plan 生成（见上面的注释）。
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      # ccache across runs: every cell recompiles the same ~70 translation units,
      # so most of the matrix is redundant work. The cache lives on the host
      # (./.ccache) and is bind-mounted into the container, because the object
      # files themselves are built in /tmp/b and thrown away with the container.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          # The protocol is in the key so each cell saves its own entries, but
          # the restore-keys are ordered broadest-last: a same-protocol cache is
          # the best match, then any protocol of this architecture (measured
          # 64.8% hits when switching protocols, because most translation units
          # do not use the per-protocol BPB_HAVE_* macros at all), then nothing.
          key: ccache-linux-${{ matrix.arch }}-${{ matrix.protocol }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.arch }}-${{ matrix.protocol }}-
            ccache-linux-${{ matrix.arch }}-

      - name: "Build static binary (inbound: ${{ matrix.protocol }})"
        run: |
          set -euo pipefail
          mkdir -p dist .ccache
          # The container runs as root and writes into the mount; the cache
          # action at the end of the job runs as the runner user and only needs
          # to read, so a plain 0755 tree is enough.
          chmod 755 .ccache
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_MAXSIZE=100M \
            alpine:3.22 sh -c '
              set -e
              apk add --no-cache g++ musl-dev cmake samurai ccache \
                      openssl-dev openssl-libs-static zlib-dev zlib-static >/dev/null
              cmake -S . -B /tmp/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DBPB_STATIC=ON \
                    -DBPB_INBOUNDS=${{ matrix.protocol }}
              cmake --build /tmp/b
              ccache -s | grep -E "Hits|Misses|Cache size" || true
              strip /tmp/b/bpb
              cp /tmp/b/bpb dist/bpb-linux-${{ matrix.arch }}-${{ matrix.protocol }}
            '
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: bpb-linux-${{ matrix.arch }}-${{ matrix.protocol }}
          path: dist/bpb-linux-${{ matrix.arch }}-${{ matrix.protocol }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 全协议二进制（-DBPB_INBOUNDS=all）：每个架构一个，安装脚本默认取它。
  # 与下面的分协议矩阵并存，不替换它们。
  # ---------------------------------------------------------------------------
  linux-all:
    name: linux-${{ matrix.arch }}-all
    needs: plan
    if: needs.plan.outputs.combined == 'all'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_matrix_all) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      # Shares no cache with the per-protocol cells on purpose: -DBPB_INBOUNDS=all
      # produces different command lines (and a bigger link), so a separate key
      # keeps each entry honest instead of thrashing one pool.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.arch }}-all-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.arch }}-all-
            ccache-linux-${{ matrix.arch }}-

      - name: Build static binary (all inbounds)
        run: |
          set -euo pipefail
          mkdir -p dist .ccache
          chmod 755 .ccache
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_MAXSIZE=100M \
            alpine:3.22 sh -c '
              set -e
              apk add --no-cache g++ musl-dev cmake samurai ccache \
                      openssl-dev openssl-libs-static zlib-dev zlib-static >/dev/null
              cmake -S . -B /tmp/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DBPB_STATIC=ON \
                    -DBPB_INBOUNDS=all
              cmake --build /tmp/b
              ccache -s | grep -E "Hits|Misses|Cache size" || true
              strip /tmp/b/bpb
              cp /tmp/b/bpb dist/bpb-linux-${{ matrix.arch }}-all
            '
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: bpb-linux-${{ matrix.arch }}-all
          path: dist/bpb-linux-${{ matrix.arch }}-all
          if-no-files-found: error
  # ---------------------------------------------------------------------------
  # Windows（MSYS2 UCRT64；CMake 会拒绝 MSVC），同样按协议分开。
  # ---------------------------------------------------------------------------
  windows:
    name: windows-x86_64-${{ matrix.protocol }}
    needs: plan
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        protocol: ${{ fromJSON(needs.plan.outputs.protocols) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-sccache

      # msys2/setup-msys2 caches downloaded packages itself, but not compiled
      # objects. sccache, not ccache: MSYS2's ccache refuses the Windows-style
      # compiler path CMake passes ("Could not find compiler
      # A:\msys64\ucrt64\bin\c++.exe in PATH"), which failed all six Windows
      # jobs in run #38 while every Linux job passed. sccache is a native mingw
      # binary and takes that path as-is (verified locally with UCRT64).
      # Correctness does not depend on the key -- the cache hashes the whole
      # command line, per-protocol BPB_HAVE_* flags included -- it only decides
      # which entries are restored first.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: C:\sccache
          key: sccache-windows-x86_64-${{ matrix.protocol }}-${{ github.sha }}
          restore-keys: |
            sccache-windows-x86_64-${{ matrix.protocol }}-
            sccache-windows-x86_64-

      - name: Configure and build
        shell: msys2 {0}
        run: |
          export SCCACHE_DIR='C:/sccache'
          export SCCACHE_CACHE_SIZE=100M
          mkdir -p "$SCCACHE_DIR"
          # sccache is a native Windows binary: SCCACHE_DIR has to be a Windows
          # path. The MSYS /c/sccache form is not understood and sccache then
          # silently uses %LOCALAPPDATA% instead, leaving this directory empty
          # for the cache action to save (measured with sccache 0.19.0).
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DBPB_INBOUNDS=${{ matrix.protocol }}
          cmake --build build
          sccache --show-stats | grep -E "Cache hits|Cache misses|hits rate" || true

      - name: Collect artifact
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/bpb.exe "dist/bpb-windows-x86_64-${{ matrix.protocol }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: bpb-windows-x86_64-${{ matrix.protocol }}
          path: dist/bpb-windows-x86_64-${{ matrix.protocol }}.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布：仅手动触发，且必须所有构建都成功。只附二进制，不产出镜像。
  #
  # tag 已存在时**覆盖**：先把 tag 强推到本次 commit，再用 overwrite_files 把
  # release 里同名的二进制逐个替换掉（不新增一堆历史资产）。
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: [plan, linux, linux-all, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package
        run: |
          set -euo pipefail
          ls -l dist
          cd dist
          sha256sum bpb-linux-* bpb-windows-* > SHA256SUMS
          cat SHA256SUMS

      - name: Point the tag at this commit (overwrites an existing one)
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f "${{ inputs.tag }}" "$GITHUB_SHA"
          git push --force origin "refs/tags/${{ inputs.tag }}"

      - name: Create or update the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          # 已存在就覆盖同名资产，而不是留下上一轮的旧二进制。
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/bpb-linux-*
            dist/bpb-windows-*
            dist/SHA256SUMS
